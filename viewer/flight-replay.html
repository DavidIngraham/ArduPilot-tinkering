<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Real flight replay</title>
    <style>
      body {
        background: #0b1520;
        color: #dfebf3;
        font: 16px system-ui;
        margin: 18px;
      }
      canvas {
        max-width: 100%;
        height: auto;
      }
      button,
      input,
      a,
      select {
        margin: 5px;
        padding: 8px;
      }
      a {
        color: #70d8c6;
      }
    </style>
  </head>
  <body>
    <label
      >Open converted flight
      <input id="file" type="file" accept=".json" /></label
    ><button id="play" disabled>Play</button
    ><label
      >Speed
      <select id="speed">
        <option>1</option>
        <option>4</option>
        <option>16</option>
        <option>64</option></select
      >×</label
    ><input
      id="time"
      aria-label="Flight time"
      type="range"
      min="0"
      max="1"
      step=".04"
      style="width: 35%"
    /><button id="record" disabled>Record recap</button
    ><button id="overview" disabled>Save 3D overview</button
    ><a id="save" hidden>Save video</a
    ><a id="image" hidden>Save overview image</a
    ><span id="status">Open a converted flight log</span>
    <div id="view"></div>
    <script type="module" src="/src/flight-replay.ts"></script>
  </body>
</html>
