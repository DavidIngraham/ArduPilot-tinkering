<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Modeled aircraft and free-body diagrams</title><desc id="desc">A rigid canopy and rigid payload share one equivalent point attachment. Separate body diagrams show external forces, opposite joint reactions and opposite restoring torques. Added air inertia belongs to the canopy mass matrix.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#213c4a;font-size:19px}.title{font-size:29px;font-weight:bold}.head{font-size:20px;font-weight:bold}.small{font-size:17px}.box{fill:#fff;stroke:#9bb2bd;stroke-width:2}.link{fill:none;stroke:#536f80;stroke-width:2.5;marker-end:url(#arrow)}.force{fill:none;stroke:#c56a2e;stroke-width:3;marker-end:url(#arrow)}.joint{fill:none;stroke:#237f78;stroke-width:3;marker-end:url(#arrow)}.ghost{fill:none;stroke:#9bb2bd;stroke-width:2;stroke-dasharray:6 5}</style>
<rect width="1200" height="900" fill="#f5f8fa"/>
<text x="32" y="45" class="title">Two bodies, one equivalent attachment</text>
<text x="32" y="78" class="">Schematic only · force directions are illustrative · moments and offsets are three-dimensional</text>
<path d="M590 110V805" stroke="#c4d1d8" stroke-width="2"/>
<text x="35" y="130" class="head">Modeled system</text>
<path d="M90 270Q280 95 485 260L465 290Q280 180 110 300Z" fill="#b9dfd4" stroke="#237f78" stroke-width="3"/>
<path d="M150 255L280 490" class="ghost"/>
<path d="M225 225L280 490" class="ghost"/>
<path d="M310 225L280 490" class="ghost"/>
<path d="M395 247L280 490" class="ghost"/>
<circle cx="280" cy="230" r="6" fill="#213c4a"/>
<text x="330" y="190" class="small">Rigid canopy</text>
<text x="330" y="217" class="small">5 aerodynamic panels</text>
<circle cx="280" cy="490" r="9" fill="#213c4a"/>
<text x="45" y="445" class="head">Equivalent point joint</text>
<text x="45" y="473" class="small">Positions coincide; rotations may differ</text>
<path d="M280 490V560" class="ghost"/>
<rect x="222" y="560" width="115" height="105" rx="15" fill="#d2e3ef" stroke="#426e89" stroke-width="3"/>
<circle cx="280" cy="612" r="6" fill="#213c4a"/>
<text x="350" y="595" class="small">Rigid payload</text>
<text x="350" y="622" class="small">Separate attitude</text>
<text x="350" y="649" class="small">and angular rate</text>
<path d="M222 595H195M195 562V630" stroke="#426e89" stroke-width="5"/>
<path d="M195 595H125" class="ghost"/>
<text x="45" y="685" class="small">Motor / propeller offset from payload CG</text>
<text x="35" y="745" class="small">Lines drawn here explain the geometry.</text>
<text x="35" y="770" class="small">The solver uses one point constraint plus</text>
<text x="35" y="795" class="small">an effective rotational spring and damper,</text>
<text x="35" y="820" class="small">not individually flexible suspension lines.</text>
<text x="625" y="130" class="head">Canopy free body</text>
<path d="M720 230Q810 170 910 230" fill="none" stroke="#237f78" stroke-width="12"/>
<circle cx="815" cy="215" r="6" fill="#213c4a"/>
<path d="M815 215V155" class="force"/>
<text x="840" y="171" class="small">Aerodynamic lift</text>
<path d="M815 215H655" class="force"/>
<text x="630" y="198" class="small">Drag</text>
<path d="M850 220V290" class="force"/>
<text x="875" y="275" class="small">Canopy</text>
<text x="875" y="297" class="small">weight</text>
<path d="M815 220V340" class="ghost"/>
<circle cx="815" cy="340" r="7" fill="#213c4a"/>
<path d="M815 340L785 405" class="joint"/>
<text x="830" y="393" class="small">−J at attachment</text>
<path d="M920 220C970 245 960 305 915 310" class="force"/>
<text x="985" y="245" class="small">Aero moment</text>
<text x="980" y="280" class="small">Includes panel</text>
<text x="980" y="307" class="small">moment arms</text>
<path d="M735 310C710 345 735 375 765 360" class="joint"/>
<text x="630" y="339" class="small">−Mⱼ</text>
<text x="625" y="438" class="small">Added air inertia enters the canopy mass matrix;</text>
<text x="625" y="462" class="small">it is not an extra applied lift or weight arrow.</text>
<text x="625" y="505" class="head">Payload free body</text>
<circle cx="815" cy="540" r="7" fill="#213c4a"/>
<path d="M815 540L845 475" class="joint"/>
<text x="860" y="520" class="small">+J at attachment</text>
<path d="M815 540V625" class="ghost"/>
<rect x="765" y="585" width="100" height="80" rx="12" fill="#d2e3ef" stroke="#426e89" stroke-width="3"/>
<circle cx="815" cy="625" r="6" fill="#213c4a"/>
<path d="M815 625V740" class="force"/>
<text x="835" y="735" class="small">Payload weight</text>
<path d="M815 625H655" class="force"/>
<text x="630" y="590" class="small">Payload drag</text>
<path d="M780 600H1010" class="force"/>
<text x="950" y="580" class="small">Thrust at motor</text>
<path d="M765 620C735 635 710 605 735 570" class="joint"/>
<text x="630" y="560" class="small">+Mⱼ</text>
<text x="930" y="650" class="small">Motor offset → pitch moment</text>
<text x="930" y="675" class="small">Shaft reaction torque</text>
<text x="930" y="700" class="small">Gyroscopic + spin-up reaction</text>
<text x="625" y="793" class="small">J: joint reaction on payload · Mⱼ: restoring/damping torque</text>
<text x="32" y="853" class="small">Internal joint forces and torques cancel for the combined aircraft; their CG moment arms still matter.</text>
</svg>
