[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"
[project]
name = "microagu-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "GPL-3.0-or-later"
[project.optional-dependencies]
analysis = ["scipy>=1.10"]
[tool.maturin]
python-source = "python"
module-name = "microagu_sim._native"
[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "../../Cargo.lock"}, {file = "src/**/*.rs"}, {file = "python/**/*"}, {file = "../sim-core/src/**/*.rs"}, {file = "../sim-core/Cargo.toml"}, {file = "../sim-io/src/**/*.rs"}, {file = "../sim-io/Cargo.toml"}]
