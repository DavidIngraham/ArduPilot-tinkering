[package]
name = "sim-python"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
[dependencies]
sim-core.workspace = true
sim-io.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-stub-gen = { version = "0.23.1", default-features = false, features = ["numpy"] }
numpy = "0.29"
serde_json.workspace = true

[[bin]]
name = "generate-stubs"
path = "src/bin/stubs.rs"
