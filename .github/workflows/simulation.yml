name: Simulator
on:
  push:
    paths: ['simulation/**', 'viewer/**', '.github/workflows/simulation.yml']
  pull_request:
    paths: ['simulation/**', 'viewer/**', '.github/workflows/simulation.yml']
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - run: cargo install wasm-bindgen-cli --version 0.2.114 --locked
      - working-directory: simulation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --release --workspace
          uv sync --locked
          uv run pytest -q
          sh legacy/build.sh
          uv run python tests/parity/compare_legacy.py
          sh tools/generate.sh
          git diff --exit-code -- schemas crates/sim-python/python/microagu_sim/_native ../viewer/public/wasm/sim_wasm.d.ts ../viewer/public/wasm/config.d.ts
          uv run maturin build --release -m crates/sim-python/Cargo.toml --out target/dist-wheels
          uv venv /tmp/microagu-wheel-test
          uv pip install --python /tmp/microagu-wheel-test/bin/python target/dist-wheels/*.whl
          cd /tmp
          /tmp/microagu-wheel-test/bin/python -c 'from microagu_sim import Simulator, config_schema; assert config_schema()'
      - working-directory: viewer
        run: |
          npm ci
          npm run build
          node --import tsx tools/test_highdof_wasm.ts
          npm test
