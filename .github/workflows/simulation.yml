name: Simulator
on:
  push:
    paths: ['simulation/**', 'viewer/**', 'research/**', 'tools/**', '.github/workflows/simulation.yml']
  pull_request:
    paths: ['simulation/**', 'viewer/**', 'research/**', 'tools/**', '.github/workflows/simulation.yml']
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo install wasm-bindgen-cli --version 0.2.114 --locked
      - working-directory: simulation
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --release --workspace
          uv sync --locked
          uv run pytest -q
          sh tools/generate.sh
          git diff --exit-code -- schemas crates/sim-python/python/microagu_sim/_native ../viewer/generated/physics/sim_wasm.d.ts ../viewer/generated/physics/config.d.ts
          uv run maturin build --release -m crates/sim-python/Cargo.toml --out target/dist-wheels
          uv venv /tmp/microagu-wheel-test
          uv pip install --python /tmp/microagu-wheel-test/bin/python target/dist-wheels/*.whl
          cd /tmp
          /tmp/microagu-wheel-test/bin/python -c 'from microagu_sim import Simulator, config_schema; assert config_schema()'
      - working-directory: viewer
        run: |
          npm ci
          npm run assets:fetch
          npm run build
          npm run test:physics
          npm run test:launch
          npm run test:sitl
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Research adapters and isolated tension model
        run: |
          uv sync --project research --locked
          uv run --project research python research/rigging-refinement-2026-10-15/verify.py --geometry-only
          uv run --project simulation python research/tension-stiffness-2026-10-15/prepare.py
          uv run --project research python research/tension-stiffness-2026-10-15/audit.py --checks-only
          uv run --project research --group capture python -m unittest discover -s research/viewer-studies -p 'test_*.py'
          uv run --project research --group capture python research/viewer-studies/check_live.py --model-dir simulation
